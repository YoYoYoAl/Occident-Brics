name: Publier le jeu
# Construit le jeu (un seul fichier HTML) et le place sur la branche gh-pages, servie par GitHub Pages.
on:
  push:
    branches: [main, v0.3-tranche]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: |
          cd dist && touch .nojekyll && git init -q -b gh-pages
          git config user.name "github-actions[bot]" && git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publication de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
